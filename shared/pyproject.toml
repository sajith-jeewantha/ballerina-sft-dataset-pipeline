[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "balpipe-common"
version = "2.1.0"
description = "Shared config, SQLite store, hashing and logging for the Ballerina Q&A dataset pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
]


[tool.setuptools.packages.find]
include = ["balpipe_common*"]
