# Non-secret pipeline settings. Secrets, models and run limits live in .env.
# Any key can be overridden with an env var: BALPIPE__<SECTION>__<KEY>=value
# (e.g. BALPIPE__GENERATE__CONCURRENCY=2).

data_dir: data                       # all outputs live here (LOCAL_DATA_DIR in .env overrides it);
                                     # output paths below are relative to it
db_file: pipeline.db

sources:
  swan_lake: "2201.14.1"             # one pinned Swan Lake update; resolved pins live in lock_file
  lock_file: config/sources.lock.json
  order: [bbe, spec, learn, central, github]   # scrape order; questions are taken round-robin in this order
  ballerina_io:
    sitemap: https://ballerina.io/sitemap.xml
    include_prefixes: ["/learn/", "/spec/lang/2024R1/"]   # /learn/ includes /learn/by-example/
    exclude_patterns:                                     # regexes on the URL path
      - "/\\d+\\.\\d+(\\.\\d+)?/"                         # old version paths
      - "/v\\d+-\\d+/"
      - "/swan-lake/"
      - "/learn/api-docs/"
      - "^/learn/$"                                       # index pages with no content of their own
      - "^/learn/by-example/$"
  github:
    org: ballerina-platform
    bbe_repo: ballerina-distribution  # BBE explanation + code + output: examples/<name>/
    bbe_path: examples
    bbe_ref: "v{swan_lake}"          # ballerina-distribution release tag for the pinned update
    module_repo_patterns: ["^module-ballerina-", "^module-ballerinax-"]
    module_include: ["README.md", "ballerina/Module.md", "ballerina/Package.md", "ballerina/README.md", "ballerina/*.bal"]
    module_exclude: ["ballerina/tests/**", "**/test*.bal"]
    max_file_bytes: 300000
  central:
    api: https://api.central.ballerina.io/2.0
    orgs: [ballerina, ballerinax]
    page_size: 50
    include_api_docs: true           # also fetch /docs/<org>/<pkg>/<version> (function and type signatures)

crawl:
  user_agent: "BallerinaCorpusBot/2.1 (+https://github.com/sajith-jeewantha/ballerina-sft-dataset-pipeline)"
  timeout_s: 60
  retries: 3
  respect_robots: true
  robots_exempt_hosts: [api.github.com, api.central.ballerina.io]   # documented JSON APIs, not crawled pages
  listing_cache_hours: 24            # reuse sitemap / repo list / tree / package list responses this long

chunk:
  max_tokens: 800                    # approximate (chars / 4); one chunk is the context of one LLM call
  min_tokens: 40                     # smaller chunks are stored but not used for questions

generate:
  concurrency: 4
  requests_per_minute: 60
  question_temperature: 0.7
  answer_temperature: 0.2
  max_question_tokens: 1024
  max_answer_tokens: 2048
  max_chunk_attempts: 3
  near_duplicate_threshold: 0.85     # word-set Jaccard similarity between questions
  providers:                         # OpenRouter routing per model-id prefix (sent as `provider`)
    "deepseek/": {order: [deepseek], allow_fallbacks: false, data_collection: deny}  # DeepSeek terms allow distillation
  # pricing:                         # optional fallback when the provider returns no cost (USD per 1M tokens)
  #   qwen/qwen3.8-flash: {input: 0.15, output: 0.47}

validate:
  bal_path: bal
  workers: 2                         # parallel `bal build` processes (each is a JVM; keep low on a laptop)
  timeout_s: 60
  java_heap: 1g
  offline: true
  prewarm_modules: [ballerina/io, ballerina/http, ballerina/log]

export:
  path: dataset.jsonl
  include_invalid: false             # leave out answers whose code failed to compile

sft:                                 # export-sft: chat-format files for fine-tuning
  dir: sft                           # train.jsonl · eval.jsonl · metadata.jsonl
  eval_fraction: 0.05                # held-out share, split by source page
  strip_source_line: true            # drop the trailing "Source: <url>" line from answers
  # Repeated in every training row: use exactly the same text at inference. "" = no system message.
  system_prompt: >-
    You are an expert Ballerina (Swan Lake) programmer. Answer questions about the Ballerina language,
    its standard library, connectors and tools accurately and concisely. When code helps, give complete,
    idiomatic Ballerina that compiles, with the imports it needs, in a ```ballerina code block. Use only
    real Ballerina syntax and APIs; if you are not sure something exists or how it behaves, say so
    instead of guessing.

report:
  path: reports/report.html
  samples: 5

storage:                              # used only when STORAGE_BUCKET=true (.env)
  snapshot_db: true                  # upload db/pipeline-<time>.db.gz after each command
  keep_db_snapshots: 20              # delete older snapshots from the bucket; 0 = keep all
  exclude: ["cache/**", ".storage/**"]   # never uploaded

logging:
  level: INFO
  format: text
