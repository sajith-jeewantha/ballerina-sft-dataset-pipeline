# Non-secret pipeline settings. Secrets, models and run limits live in .env.
# Any key can be overridden with an env var: BALPIPE__<SECTION>__<KEY>=value
# (e.g. BALPIPE__GENERATE__CONCURRENCY=2).

data_dir: data                       # all outputs live here (LOCAL_DATA_DIR in .env overrides it);
                                     # output paths below are relative to it
db_file: pipeline.db

sources:
  swan_lake: "2201.14.1"             # one pinned Swan Lake update; resolved pins live in lock_file
  lock_file: config/sources.lock.json
  order: [bbe, spec, learn, central, github]   # scrape order; questions are taken round-robin in this order
  ballerina_io:
    sitemap: https://ballerina.io/sitemap.xml
    include_prefixes: ["/learn/", "/spec/lang/2024R1/"]   # /learn/ includes /learn/by-example/
    exclude_patterns:                                     # regexes on the URL path
      - "/\\d+\\.\\d+(\\.\\d+)?/"                         # old version paths
      - "/v\\d+-\\d+/"
      - "/swan-lake/"
      - "/learn/api-docs/"
      - "^/learn/$"                                       # index pages with no content of their own
      - "^/learn/by-example/$"
  github:
    org: ballerina-platform
    bbe_repo: ballerina-distribution  # BBE explanation + code + output: examples/<name>/
    bbe_path: examples
    bbe_ref: "v{swan_lake}"          # ballerina-distribution release tag for the pinned update
    module_repo_patterns: ["^module-ballerina-", "^module-ballerinax-"]
    module_include: ["README.md", "ballerina/Module.md", "ballerina/Package.md", "ballerina/README.md", "ballerina/*.bal"]
    module_exclude: ["ballerina/tests/**", "**/test*.bal"]
    max_file_bytes: 300000
  central:
    api: https://api.central.ballerina.io/2.0
    orgs: [ballerina, ballerinax]
    page_size: 50
    include_api_docs: true           # also fetch /docs/<org>/<pkg>/<version> (function and type signatures)

crawl:
  user_agent: "BallerinaCorpusBot/2.2 (+https://github.com/sajith-jeewantha/ballerina-sft-dataset-pipeline)"
  timeout_s: 60
  retries: 3
  respect_robots: true
  robots_exempt_hosts: [api.github.com, api.central.ballerina.io]   # documented JSON APIs, not crawled pages
  listing_cache_hours: 24            # reuse sitemap / repo list / tree / package list responses this long

chunk:
  max_tokens: 800                    # approximate (chars / 4); one chunk is the context of one LLM call
  min_tokens: 40                     # smaller chunks are stored but not used for questions

generate:
  concurrency: 4
  requests_per_minute: 60
  question_temperature: 0.7
  answer_temperature: 0.2
  max_question_tokens: 1024
  max_answer_tokens: 2048
  max_chunk_attempts: 3
  near_duplicate_threshold: 0.85     # word-set Jaccard similarity between questions
  providers:                         # OpenRouter routing per model-id prefix (sent as `provider`)
    "deepseek/": {order: [], allow_fallbacks: true, data_collection: deny}  # DeepSeek terms allow distillation
  # pricing:                         # optional fallback when the provider returns no cost (USD per 1M tokens)
  #   qwen/qwen3.8-flash: {input: 0.15, output: 0.47}

validate:
  bal_path: bal
  workers: 2                         # parallel `bal build` processes (each is a JVM; keep low on a laptop)
  timeout_s: 60
  java_heap: 1g
  offline: true
  prewarm_modules: [ballerina/io, ballerina/http, ballerina/log]

export:
  path: dataset.jsonl
  include_invalid: false             # leave out answers whose code failed to compile

sft:                                 # export-sft: chat-format files for fine-tuning
  dir: sft                           # train.jsonl · eval.jsonl · metadata.jsonl
  eval_fraction: 0.05                # held-out share, split by source page
  strip_source_line: true            # drop the trailing "Source: <url>" line from answers
  # Repeated in every training row: use exactly the same text at inference. "" = no system message.
  system_prompt: >-
    You are an expert Ballerina (Swan Lake) programmer. Answer questions about the Ballerina language,
    its standard library, connectors and tools accurately and concisely. When code helps, give complete,
    idiomatic Ballerina that compiles, with the imports it needs, in a ```ballerina code block. Use only
    real Ballerina syntax and APIs; if you are not sure something exists or how it behaves, say so
    instead of guessing.

prompts:                             # plan-prompts / generate-prompts (item-driven prompts, M5)
  set_name: pilot                    # outputs go to <data>/prompts/pilot/
  nodes:                             # graph nodes in scope; [] = every active node. Pilot: the HTTP cluster
    - lib.http
    - topic.rest_api
    - concept.services_listeners
    - concept.resource_methods
    - concept.client_objects
    - lib.auth
    - lib.jwt
    - lib.oauth2
    - lib.mime
  budgets: {core: 10, important: 6, long_tail: 3}   # prompts per item, by the node's priority
  # full run (dataset v1): set_name: v1, nodes: [], budgets: {core: 4, important: 2, long_tail: 1}
  # (~6,800 prompts), and assemble.prompt_sets: [pilot, v1]
  task_mix: {write_code: 0.35, use_api: 0.2, explain: 0.2, fix_code: 0.15, design: 0.1}
  max_rounds: 3                      # writer calls per item: the first, plus gap-fill for rejected slots
  min_score: 3                       # every review score (1-5) must reach this to accept a prompt
  near_duplicate_threshold: 0.8      # word-set Jaccard between prompts in the set
  max_grounding_tokens: 3500         # excerpts per item (item sources, Central symbols, FTS5 neighbours)
  chunks_per_source: 2
  fts_neighbours: 2
  max_symbols: 6

answers:                             # answer-prompts (verified answers, M6)
  max_attempts: 3                    # first answer + up to 2 repairs with the real bal errors / judge issues
  temperature: 0.2
  max_tokens: 4096
  code_tasks: [write_code, fix_code] # answers to these must contain Ballerina code
  judge_tasks: [explain, design]     # the judge checks these (and any answer without code)
  judge_min_score: 3
  run_tests: false                   # true = `bal test` the tests an answer contains: EXECUTES model-written
                                     # code. Turn on only in a sandbox (container/VM); off = tests are compiled
  max_feedback_errors: 8

codebases:                           # codebases build / verify / attach (codebase pool, M7)
  pool_size: 100                     # verified Swan Lake projects kept (plan: 50-150)
  eval_fraction: 0.2                 # held out (by id hash) for M8's eval tasks; never in training prompts
  groups: [guides, wso2, external, platform]   # preferred sources, in order
  min_files: 2
  max_files: 40
  min_tokens: 800
  max_tokens: 10000                  # the whole project must fit a prompt
  max_per_repo: 3
  kinds: [compile_error, unfinished_feature, version_drift, failing_test]
  run_tests: false                   # failing_test states RUN the project's tests: sandbox only
  build_timeout_s: 300
  context_max_tokens: 14000          # code packed into a codebase prompt
  max_candidates: 250                # candidates tried per run while filling the pool

corpus:                              # corpus: the raw pretraining corpus (M9)
  version: raw-v1                    # data/corpus/raw-v1/
  part_tokens: 5000000               # approximate tokens per part-NNNN.jsonl.gz
  generated_weight: 0.3              # sampling weight of generated code
  min_tokens: 20
  include_eval_codebases: false

miner:                               # mine-fixes: before/after fixes from repo history (M9)
  groups: [guides, platform, wso2]
  max_commits: 400                   # recent non-merge commits scanned per repo
  max_files: 3                       # .bal source files a fix may change
  max_lines: 80                      # added + deleted lines
  max_fixes_per_repo: 25
  clone_timeout_s: 900

assemble:                            # assemble: dataset v1 (M10)
  version: v1                        # files go to <data>/datasets/v1/
  prompt_sets: []                    # prompt sets to include; [] = prompts.set_name
  include_questions: true            # chunk-grounded Q&A (invalid answers left out)
  include_mined_fixes: false         # unverified before/after fixes as fix_code samples (opt in)
  mined_fix_max_lines: 40
  caps: {core: 14, important: 9, long_tail: 5}   # samples kept per graph item
  max_per_page: 6                    # Q&A per page when no graph item is known
  near_duplicate_threshold: 0.85     # MinHash similarity between prompts
  eval_fraction: 0.03                # validation split, by codebase / page / prompt
  split_salt: dataset-split          # don't change once a version is published
  dpo: true                          # dpo/pairs.jsonl from repaired answers
  cpt: true                          # copy the raw corpus into cpt/

eval:                                # build-eval: held-out eval set and decontamination
  version: v1                        # files go to <data>/eval/v1/
  bbe_eval_fraction: 0.30            # BBE examples held out, decided by a hash of the example name
  split_salt: bbe-split              # don't change once training data exists: it reshuffles the split
  verify: true                       # bal run (output vs .out) / bal build each eval item
  run_timeout_s: 120
  workers: 2                         # parallel bal processes
  near_duplicate_threshold: 0.8      # MinHash similarity that counts as a copy
  containment: 0.5                   # share of an item's distinctive shingles that counts as a copy
  min_shingles: 15                   # smaller items are matched exactly only
  common_df: 10                      # shingles in this many BBE examples are boilerplate, not evidence
  # --- eval set v2 and baselines (sftgen eval, M8) ---
  # benchmarks: HumanEval (MIT, all 164) and MBPP (CC BY 4.0, test split 11-510); see BenchmarkSource
  translate_attempts: 3              # teacher translation + repairs with the real bal errors
  ecosystem_tasks_per_node: 2        # eval tasks the teacher writes per core graph node
  models:                            # baselines; "teacher" = ANSWER_GEN_MODEL
    base: qwen/qwen3.8-27b
  samples: 5                         # answers per item per model (pass@k)
  ks: [1, 5]
  sample_temperature: 0.8
  max_answer_tokens: 3000
  run_tests: false                   # true = run benchmark tests and BBE programs: EXECUTES model code.
                                     # Sandbox only. false = compile-only scores (mode "compile")

report:
  path: reports/report.html
  samples: 5

repos:                                # collect-repos (LIMIT_REPOS in .env caps clones per run)
  register_file: docs/licence-register.csv
  groups:                             # earlier groups win when the same file is in several repos
    - name: platform
      org: ballerina-platform
      include: ["^module-ballerina-", "^module-ballerinax-"]
      intended_use: "corpus; commit-mining"
    - name: guides
      org: ballerina-guides
      intended_use: "codebase-pool; commit-mining"
    - name: wso2
      query: "org:wso2 language:Ballerina fork:false"
      intended_use: "codebase-pool; corpus"
    - name: external                  # Swan Lake era (GA 2022-02), most-starred first
      query: "language:Ballerina fork:false archived:false pushed:>=2022-02-01 -org:ballerina-platform -org:ballerina-guides -org:wso2 -org:wso2-enterprise"
      intended_use: "corpus; codebase-pool candidate"
  sparse_patterns: ["*.bal", "Ballerina.toml", "*.out", "README.md", "Package.md", "Module.md",
                    "/LICENSE*", "/LICENCE*", "/COPYING*"]
  max_file_bytes: 300000              # larger files: recorded as too_large, text not stored
  workers: 4                          # parallel clones
  keep_snapshots: true                # data/repos/<owner>__<repo>@<sha12>.tar.gz
  near_duplicate_threshold: 0.8       # MinHash similarity of .bal files

storage:                              # used only when STORAGE_BUCKET=true (.env)
  snapshot_db: true                  # upload db/pipeline-<time>.db.gz after each command
  keep_db_snapshots: 20              # delete older snapshots from the bucket; 0 = keep all
  exclude: ["cache/**", ".storage/**"]   # never uploaded

logging:
  level: INFO
  format: text
